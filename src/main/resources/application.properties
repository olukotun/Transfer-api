spring.application.name=payment-transfer-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/payments}
spring.datasource.username=${DB_USERNAME:payments_user}
spring.datasource.password=${DB_PASSWORD}
management.endpoint.health.show-details=always
spring.jpa.hibernate.ddl-auto=validate
spring.devtools.restart.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/payments
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8082/realms/payments/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences[0]=payments-api


payments.worker.enabled=${PAYMENTS_WORKER_ENABLED:false}
payments.worker.poll-delay-ms=2000