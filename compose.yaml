name: payments

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payments_user", "-d", "payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: payment-transfer-api:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USERNAME: payments_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
      JWT_JWK_SET_URI: http://keycloak:8080/realms/payments/protocol/openid-connect/certs

      PAYMENTS_WORKER_ENABLED: "false"
      PAYMENTS_SQS_ENABLED: "true"
      PAYMENTS_SQS_CONSUMER_ENABLED: "true"
      PAYMENTS_SQS_QUEUE_URL: https://sqs.us-east-2.amazonaws.com/611065450457/payments-transfer-requests

      AWS_PROFILE: payments-dev
      AWS_REGION: us-east-2
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: ${PAYMENTS_AWS_CONFIG_DIR:?Set PAYMENTS_AWS_CONFIG_DIR first}
        target: /aws
        read_only: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  payments-data:
    external: true
    name: payment-transfer-data
  keycloak-data: