name: payments

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payments_user", "-d", "payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: payment-transfer-api:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USERNAME: payments_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
      JWT_JWK_SET_URI: http://keycloak:8080/realms/payments/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [ "start-dev" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD first}
      KC_HOSTNAME: http://localhost:8082
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  payments-data:
    external: true
    name: payment-transfer-data
  keycloak-data: